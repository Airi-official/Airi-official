<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Sairi(N) — Japanese-inspired creator banner</title>
  <desc id="desc">A dreamy anime-inspired night scene with a glowing moon, distant mountains, cherry blossoms, and the name Sairi(N).</desc>

  <defs>
    <linearGradient id="sky" x1="72" y1="20" x2="1115" y2="412" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17152F"/>
      <stop offset=".48" stop-color="#352348"/>
      <stop offset="1" stop-color="#A64F70"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="115" y1="152" x2="688" y2="245" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8F2"/>
      <stop offset=".55" stop-color="#FFD9E2"/>
      <stop offset="1" stop-color="#F3A9C6"/>
    </linearGradient>
    <linearGradient id="moonFill" x1="818" y1="55" x2="1022" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF9E8"/>
      <stop offset="1" stop-color="#F7BDD0"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0" cy="0" r="1" gradientTransform="matrix(0 185 -185 0 919 152)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD9E4" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FFD9E4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="18" r="1" fill="#FFF" fill-opacity=".12"/>
      <circle cx="74" cy="42" r=".8" fill="#FFF" fill-opacity=".1"/>
      <circle cx="101" cy="96" r="1" fill="#FFF" fill-opacity=".09"/>
      <circle cx="39" cy="108" r=".7" fill="#FFF" fill-opacity=".12"/>
    </pattern>
    <filter id="softGlow" x="65" y="95" width="660" height="190" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="17" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="780" y="32" width="280" height="280" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <g id="sakura" fill="#FFD5E0">
      <ellipse cy="-9" rx="4.7" ry="8"/>
      <ellipse cy="9" rx="4.7" ry="8"/>
      <ellipse cx="-9" rx="8" ry="4.7"/>
      <ellipse cx="9" rx="8" ry="4.7"/>
      <circle r="3" fill="#F3A9C6"/>
    </g>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#sky)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grain)"/>
  <path d="M0 338 126 271l83 42 111-100 117 115 108-75 107 84 127-129 105 85 102-63 114 88v82H0z" fill="#211C38" fill-opacity=".72"/>
  <path d="m0 371 141-66 111 53 131-79 111 74 119-44 128 55 112-66 109 57 118-51 120 54v62H0z" fill="#17182F" fill-opacity=".88"/>
  <path d="M0 375c158-23 255 20 406 1 173-22 271-16 416 3 143 19 252-11 378-24v65H0z" fill="#13162C"/>

  <!-- moonlit Japanese-inspired landscape -->
  <circle cx="920" cy="157" r="145" fill="url(#moonGlow)"/>
  <circle cx="920" cy="157" r="86" fill="#F9D7DE" fill-opacity=".12" filter="url(#shadow)"/>
  <circle cx="920" cy="157" r="70" fill="url(#moonFill)"/>
  <path d="M879 122c17-17 42-22 62-14-19 4-34 20-37 40-3 21 9 40 27 48-27 4-53-12-61-38-4-13 0-27 9-36z" fill="#EAA6BC" fill-opacity=".48"/>
  <circle cx="951" cy="137" r="8" fill="#E8A6BC" fill-opacity=".4"/>
  <circle cx="946" cy="183" r="13" fill="#E8A6BC" fill-opacity=".28"/>

  <!-- distant torii silhouette -->
  <g stroke="#D887A8" stroke-opacity=".68" stroke-width="8" stroke-linecap="round">
    <path d="M891 295v-45m58 45v-45M878 250h84m-73-13h62"/>
    <path d="m878 237-10-5m86 5 10-5" stroke-width="5"/>
  </g>

  <!-- stars -->
  <g fill="#FFF1E9">
    <circle cx="766" cy="82" r="2.5"/><circle cx="1092" cy="102" r="2"/>
    <circle cx="1069" cy="221" r="2.5"/><circle cx="825" cy="211" r="1.7"/>
    <circle cx="742" cy="159" r="1.8"/><circle cx="1142" cy="164" r="1.6"/>
    <path d="M1090 278v10m-5-5h10M785 260v8m-4-4h8" stroke="#FFF1E9" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- sakura branches and drifting petals -->
  <g stroke="#D889A5" stroke-width="3" stroke-linecap="round" stroke-opacity=".72">
    <path d="M1192 24c-51 44-81 85-112 139m54-81-36-15m59-11-3-31m-48 83-36 1m87-45 26-21"/>
    <path d="M18 281c36-28 62-57 86-96m-57 67 2-29m29 7 28-14m-49 42-23 10" stroke-opacity=".42"/>
  </g>
  <g opacity=".95">
    <use href="#sakura" transform="translate(1083 162) scale(.8)"/>
    <use href="#sakura" transform="translate(1125 99) scale(.55)"/>
    <use href="#sakura" transform="translate(1135 48) scale(.72)"/>
    <use href="#sakura" transform="translate(1043 83) scale(.48)"/>
    <use href="#sakura" transform="translate(72 195) scale(.55)"/>
    <use href="#sakura" transform="translate(1110 332) scale(.42)" opacity=".75"/>
  </g>
  <g fill="#FFD5E0" opacity=".8">
    <path d="M728 119c12-8 19-4 19 1-1 7-11 11-19 13 3-5 3-9 0-14z"/>
    <path d="M1038 306c11-8 18-4 18 1-1 7-11 11-19 13 3-5 3-9 1-14z"/>
    <path d="M794 335c9-7 15-3 15 1-1 6-9 9-16 11 2-4 2-8 1-12z"/>
  </g>

  <!-- creator identity -->
  <g font-family="Georgia, 'Yu Mincho', 'Hiragino Mincho ProN', serif">
    <text x="88" y="121" fill="#F3B7CC" font-size="15" font-weight="600" letter-spacing="6">CREATOR  ·  DREAMER</text>
    <path d="M89 143h94" stroke="#E9A9C1" stroke-opacity=".78"/>
    <text x="78" y="236" fill="#F6AFC8" fill-opacity=".28" font-size="91" font-weight="700" letter-spacing="1" filter="url(#softGlow)">Sairi(N)</text>
    <text x="78" y="236" fill="url(#titleFill)" font-size="91" font-weight="700" letter-spacing="1">Sairi(N)</text>
    <text x="91" y="281" fill="#FFE8EE" font-size="21" letter-spacing="2">サイリ — let your dreams bloom</text>
    <text x="91" y="330" fill="#F5C4D3" fill-opacity=".78" font-size="13" letter-spacing="4">桜の夜に、想いを込めて</text>
  </g>

  <rect x="1" y="1" width="1198" height="418" rx="27" stroke="#FFE7EF" stroke-opacity=".18" stroke-width="2"/>
</svg>

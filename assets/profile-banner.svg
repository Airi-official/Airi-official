<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">AiriBot — made by Sairi(N)</title>
  <desc id="desc">An animated navy and sky-blue banner for AiriBot, a configurable Python Discord bot.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D1D"/>
      <stop offset="0.55" stop-color="#111936"/>
      <stop offset="1" stop-color="#172648"/>
    </linearGradient>
    <linearGradient id="botCard" x1="790" y1="80" x2="1070" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#86CFFF"/>
      <stop offset="1" stop-color="#5865F2"/>
    </linearGradient>
    <linearGradient id="aqua" x1="70" y1="210" x2="670" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#AEE8FF"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#5865F2" stop-opacity=".38"/>
      <stop offset="1" stop-color="#5865F2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#9DDFFF" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="720" y="38" width="405" height="360" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#02040C" flood-opacity=".55"/>
    </filter>
    <filter id="textGlow" x="40" y="105" width="650" height="190" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="1020" cy="210" r="270" fill="url(#glow)"/>
  <circle cx="1125" cy="55" r="110" fill="#5865F2" fill-opacity=".10"/>

  <!-- animated ambient particles -->
  <g fill="#AEE8FF">
    <circle cx="718" cy="92" r="3" opacity=".7">
      <animate attributeName="cy" values="92;82;92" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;.25;.7" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1112" cy="370" r="4" opacity=".45">
      <animate attributeName="cy" values="370;358;370" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="704" cy="305" r="2" fill="#C6B7FF">
      <animate attributeName="cx" values="704;714;704" dur="4.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- identity -->
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <g transform="translate(72 74)">
      <rect width="15" height="15" rx="4" fill="#5865F2"/>
      <rect x="20" y="3" width="84" height="9" rx="4.5" fill="#5865F2" fill-opacity=".55"/>
      <text x="116" y="13" fill="#AEE8FF" font-size="13" font-weight="800" letter-spacing="3.2">DISCORD BOT</text>
    </g>

    <text x="70" y="188" fill="url(#aqua)" font-size="82" font-weight="900" letter-spacing="-4">AiriBot</text>
    <circle cx="430" cy="173" r="10" fill="#57D5A7">
      <animate attributeName="r" values="8;11;8" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;.65;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>

    <text x="72" y="232" fill="#CDD7EA" font-size="19" font-weight="600">A configurable companion for your server</text>

    <g transform="translate(72 274)">
      <rect width="166" height="44" rx="22" fill="#5865F2" fill-opacity=".18" stroke="#5865F2" stroke-opacity=".75"/>
      <circle cx="24" cy="22" r="5" fill="#57D5A7"/>
      <text x="38" y="28" fill="#EAF2FF" font-size="14" font-weight="750" letter-spacing=".5">UTILITIES</text>

      <rect x="178" width="187" height="44" rx="22" fill="#5865F2" fill-opacity=".18" stroke="#5865F2" stroke-opacity=".75"/>
      <path d="M203 14v16m-8-8h16" stroke="#AEE8FF" stroke-width="3" stroke-linecap="round"/>
      <text x="220" y="28" fill="#EAF2FF" font-size="14" font-weight="750" letter-spacing=".5">MODERATION</text>

      <rect x="377" width="144" height="44" rx="22" fill="#5865F2" fill-opacity=".18" stroke="#5865F2" stroke-opacity=".75"/>
      <path d="M402 17l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z" fill="#F7C66A"/>
      <text x="419" y="28" fill="#EAF2FF" font-size="14" font-weight="750" letter-spacing=".5">FUN</text>
    </g>

    <text x="72" y="369" fill="#7F91AF" font-size="14" font-weight="650" letter-spacing="1.2">CREATED BY SAIRI(N)</text>
  </g>

  <!-- bot profile card -->
  <g filter="url(#shadow)">
    <rect x="756" y="58" width="340" height="304" rx="30" fill="#0E1428" stroke="#8596BC" stroke-opacity=".28" stroke-width="2"/>

    <!-- card header -->
    <rect x="756" y="58" width="340" height="66" rx="30" fill="#151D38"/>
    <path d="M756 124h340" stroke="#8596BC" stroke-opacity=".16"/>
    <circle cx="788" cy="91" r="15" fill="#5865F2"/>
    <circle cx="783" cy="87" r="5" fill="#AEE8FF"/>
    <circle cx="793" cy="87" r="5" fill="#AEE8FF"/>
    <path d="M783 97c6 5 14 5 20 0" stroke="#AEE8FF" stroke-width="3" stroke-linecap="round"/>

    <text x="814" y="86" fill="#F4F7FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800">AiriBot</text>
    <text x="814" y="106" fill="#57D5A7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">● ONLINE</text>

    <!-- chat area -->
    <g transform="translate(780 146)">
      <rect width="292" height="72" rx="18" fill="#1A2546"/>
      <circle cx="28" cy="27" r="13" fill="#5865F2"/>
      <text x="28" y="32" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="900">&gt;</text>
      <text x="52" y="31" fill="#DDE8FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">serverinfo</text>
      <text x="52" y="52" fill="#8798B8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">prefix-based commands</text>
    </g>

    <g transform="translate(780 230)">
      <rect width="292" height="105" rx="18" fill="url(#botCard)"/>
      <circle cx="26" cy="26" r="10" fill="#FFFFFF" fill-opacity=".95"/>
      <path d="M21 26l3 3 7-8" stroke="#5865F2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="31" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="850">Server status</text>

      <g transform="translate(24 48)">
        <rect width="76" height="38" rx="10" fill="#FFFFFF" fill-opacity=".16"/>
        <text x="38" y="24" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="800">READY</text>
        <rect x="84" width="76" height="38" rx="10" fill="#FFFFFF" fill-opacity="16"/>
        <text x="122" y="24" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="800">PYTHON</text>
        <rect x="168" width="76" height="38" rx="10" fill="#FFFFFF" fill-opacity=".16"/>
        <text x="206" y="24" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="800">ONLINE</text>
      </g>

      <g transform="translate(260 18)">
        <circle r="7" fill="#57D5A7">
          <animate attributeName="r" values="6;9;6" dur="1.8s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <!-- python/code accent -->
  <g opacity=".55">
    <path d="M84 342h430" stroke="#5865F2" stroke-opacity=".35"/>
    <text x="514" y="346" fill="#8090AE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">PYTHON · DISCORD.PY</text>
  </g>
</svg>

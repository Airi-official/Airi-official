<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Airi — building with curiosity</title>
  <desc id="desc">A dark indigo and violet gradient banner with abstract glowing orbits and the name Airi.</desc>
  <defs>
    <linearGradient id="bg" x1="30" y1="16" x2="1165" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10152B"/>
      <stop offset=".55" stop-color="#211B4A"/>
      <stop offset="1" stop-color="#38205B"/>
    </linearGradient>
    <linearGradient id="glow" x1="770" y1="47" x2="1124" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" stop-opacity=".72"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="accent" x1="92" y1="0" x2="443" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <filter id="blur" x="760" y="-46" width="528" height="412" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="1010" cy="150" r="130" fill="url(#glow)" filter="url(#blur)"/>
  <g opacity=".55" stroke="#C4B5FD" stroke-width="1.2">
    <ellipse cx="1010" cy="160" rx="185" ry="70" transform="rotate(-28 1010 160)"/>
    <ellipse cx="1010" cy="160" rx="185" ry="70" transform="rotate(28 1010 160)"/>
    <circle cx="1010" cy="160" r="116"/>
  </g>
  <circle cx="1139" cy="83" r="5" fill="#67E8F9"/>
  <circle cx="870" cy="222" r="4" fill="#C4B5FD"/>
  <circle cx="1057" cy="264" r="3" fill="#fff" fill-opacity=".8"/>
  <path d="M88 83h42" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <text x="88" y="166" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="68" font-weight="750" letter-spacing="-2">Airi</text>
  <text x="91" y="207" fill="#D7D5E8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" letter-spacing="3">BUILDING WITH CURIOSITY</text>
  <path d="M91 245h220" stroke="#FFFFFF" stroke-opacity=".18"/>
  <text x="91" y="273" fill="#B8B8D0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">Projects · experiments · ideas</text>
</svg>
